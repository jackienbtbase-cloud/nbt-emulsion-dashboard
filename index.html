<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emulsion Tracking Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f6f7fb; --card: #ffffff; --soft: #f8f9fc; --line: #e9ebf2; --hair: #f0f2f7;
            --text: #1b2237; --muted: #6a7389; --faint: #aab1c2;
            --brand: #3d5afe; --brand-soft: #eef1ff;
            --ok: #12a06b; --warn: #ee8a00; --bad: #e5484d; --ink: #1b2237;
            --shadow: 0 1px 2px rgba(20,30,60,.04), 0 8px 24px rgba(20,30,60,.04);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0c111d; --card: #141b2d; --soft: #182036; --line: #25304d; --hair: #1d2641;
                --text: #e7ecf8; --muted: #98a4c0; --faint: #5b6888;
                --brand: #7a93ff; --brand-soft: #1a2750;
                --ok: #38d19b; --warn: #ffb02e; --bad: #ff6b70; --ink: #e7ecf8;
                --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.2);
            }
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 32px 28px 72px; background: var(--bg); color: var(--text);
               font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
               font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
        .container { max-width: 1480px; margin: 0 auto; }
        .num, .t-num, td, th { font-variant-numeric: tabular-nums; }

        /* ===== 顶部 ===== */
        .topbar { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
        .topbar h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
        .topbar p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
        .actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .updated { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); margin-right: 6px; }
        .live { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
        .live.bad { background: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 20%, transparent); }
        .btn { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
               color: var(--text); font: inherit; font-weight: 600; font-size: 13px; cursor: pointer; transition: border-color .15s, transform .1s; }
        .btn:hover { border-color: var(--brand); color: var(--brand); }
        .btn:active { transform: scale(.98); }
        .btn:disabled { opacity: .6; cursor: wait; }
        .spin { animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
        .searchbox { position: relative; }
        .searchbox svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
        .search { height: 38px; width: 270px; padding: 0 14px 0 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: 13px; outline: none; transition: border-color .15s, box-shadow .15s; }
        .search::placeholder { color: var(--faint); }
        .search:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }

        .loaderr { display: none; background: color-mix(in srgb, var(--bad) 10%, var(--card)); color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 30%, transparent); border-radius: 12px; padding: 12px 16px; margin-bottom: 18px; font-size: 13px; font-weight: 600; }

        /* ===== 状态切换栏（一条，横向可滚动，不换行） ===== */
        .tabs { display: flex; align-items: stretch; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow-x: auto; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab { --c: var(--faint); position: relative; display: flex; align-items: baseline; gap: 8px; padding: 14px 20px 15px; border: 0; background: none; color: var(--muted); font: inherit; cursor: pointer; white-space: nowrap; transition: background .15s, color .15s; }
        .tab:hover { background: var(--soft); }
        .tab::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: transparent; transition: background .15s; }
        .tab .t-name { font-size: 13px; font-weight: 600; }
        .tab .t-num { font-size: 20px; font-weight: 700; color: var(--text); line-height: 1; }
        .tab.zero .t-num { color: var(--faint); font-weight: 600; }
        .tab.zero .t-name { color: var(--faint); font-weight: 500; }
        .tab.active { color: var(--text); }
        .tab.active::after { background: var(--c); }
        .tab.all { --c: var(--brand); }
        .tab.all .t-name { color: var(--brand); }
        .t-bad { align-self: center; min-width: 18px; height: 18px; padding: 0 5px; display: inline-grid; place-items: center; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; font-weight: 700; }
        .t-sep { width: 1px; background: var(--line); margin: 12px 6px; flex: none; }

        /* ===== 分组 ===== */
        .group-head { display: flex; align-items: baseline; gap: 12px; margin: 34px 4px 12px; flex-wrap: wrap; }
        .group-head h2 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
        .group-head .cnt { color: var(--muted); font-weight: 600; margin-left: 6px; }
        .group-head.urgent h2 { color: var(--bad); }
        .group-head.urgent h2::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); margin-right: 10px; vertical-align: 2px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--bad) 18%, transparent); }
        .group-head .hint { font-size: 12.5px; color: var(--muted); }
        .totals { margin-left: auto; font-size: 12.5px; color: var(--muted); }
        .totals b { color: var(--text); font-weight: 700; margin: 0 14px 0 5px; }
        .totals b:last-child { margin-right: 0; }

        /* ===== 表格 ===== */
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        table.main { table-layout: fixed; min-width: 1240px; }
        th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); padding: 14px 16px 10px; white-space: nowrap; border-bottom: 1px solid var(--line); }
        td { padding: 18px 16px; border-bottom: 1px solid var(--hair); vertical-align: top; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover td { background: var(--soft); }
        td.k { box-shadow: inset 3px 0 0 transparent; }
        tr.lv1 td.k { box-shadow: inset 3px 0 0 var(--warn); }
        tr.lv2 td.k { box-shadow: inset 3px 0 0 var(--bad); }
        tr.lv3 td.k { box-shadow: inset 3px 0 0 var(--ink); }
        .key { font-size: 14.5px; font-weight: 700; letter-spacing: .01em; }
        .sum { margin-top: 3px; font-size: 12.5px; color: var(--muted); }
        .dim { color: var(--faint); }
        .cust { font-weight: 500; }

        .st { --c: var(--muted); display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: color-mix(in srgb, var(--c) 82%, var(--text)); }
        .st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
        .st.cancelled { text-decoration: line-through; color: var(--muted); }

        .who { display: flex; align-items: center; gap: 9px; }
        .avatar { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 10px; font-weight: 700; color: #fff; }
        .who span { font-size: 13px; }

        .item { font-size: 13px; line-height: 1.6; }
        .item b { margin-left: 8px; color: var(--brand); font-weight: 700; }

        .docs { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; font-weight: 700; letter-spacing: .02em; }
        a.doc { color: var(--brand); text-decoration: none; }
        a.doc:hover { text-decoration: underline; }
        span.doc.off { color: var(--faint); font-weight: 500; opacity: .75; }
        span.doc.missing { color: var(--bad); background: color-mix(in srgb, var(--bad) 11%, transparent); padding: 0 7px; border-radius: 6px; }

        .comment { font-size: 13px; color: var(--text); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
        .comment.none { color: var(--faint); }

        .age { display: inline-block; font-size: 12.5px; font-weight: 700; padding: 3px 11px; border-radius: 999px; white-space: nowrap; }
        .age.lv1 { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
        .age.lv2 { color: var(--bad);  background: color-mix(in srgb, var(--bad) 13%, transparent); }
        .age.lv3 { color: var(--card); background: var(--ink); }
        .fresh { font-size: 13px; font-weight: 600; color: var(--ok); }
        .fresh.old { color: var(--muted); font-weight: 500; }
        .age-sub { margin-top: 6px; font-size: 12px; color: var(--muted); }

        .po-sib { display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 600; color: #7a5af0; cursor: pointer; }
        .po-sib:hover { text-decoration: underline; }

        .empty { text-align: center; color: var(--faint); padding: 34px; }
        .allclear { margin-top: 28px; padding: 16px 20px; border-radius: 14px; font-weight: 600; color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, var(--card)); border: 1px solid color-mix(in srgb, var(--ok) 25%, transparent); }

        /* ===== 已结束（折叠成一条） ===== */
        details.archive { margin-top: 40px; }
        details.archive > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); padding: 12px 18px; border-radius: 12px; border: 1px dashed var(--line); user-select: none; }
        details.archive > summary::-webkit-details-marker { display: none; }
        details.archive > summary:hover { background: var(--card); }
        details.archive .chev { transition: transform .15s; }
        details.archive[open] .chev { transform: rotate(90deg); }
        details.archive summary b { color: var(--text); margin-left: 4px; }
        details.archive .card { margin-top: 10px; box-shadow: none; }
        .archive table { font-size: 12.5px; color: var(--muted); }
        .archive td { padding: 9px 16px; white-space: nowrap; }
        .archive td.s { white-space: normal; max-width: 380px; }
        .archive .key { font-size: 13px; color: var(--text); }
        .archive .st { font-size: 12px; }

        /* ===== 本机隐藏（只存在这台电脑的浏览器里） ===== */
        td.k { position: relative; }
        .hide-btn { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; display: grid; place-items: center; padding: 0; border: 1px solid transparent; border-radius: 7px; background: none; color: var(--faint); cursor: pointer; opacity: 0; transition: opacity .12s, background .12s, color .12s; }
        tr:hover .hide-btn, .hide-btn:focus-visible { opacity: 1; }
        .hide-btn:hover { background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 25%, transparent); }
        .hide-btn.unhide:hover { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 25%, transparent); }
        .archive td.key { position: relative; padding-right: 40px; }
        .archive .hide-btn { top: 50%; transform: translateY(-50%); }
        tr.is-hidden td { opacity: .45; }
        tr.is-hidden .hide-btn { opacity: 1; }
        .btn.hidden-toggle { display: none; }
        .btn.hidden-toggle.show { display: inline-flex; }
        .btn.hidden-toggle.on { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
        .hidebar { display: none; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 0 16px; padding: 10px 16px; border-radius: 12px; font-size: 13px; color: var(--muted); background: var(--brand-soft); border: 1px solid color-mix(in srgb, var(--brand) 25%, transparent); }
        .hidebar.show { display: flex; }
        .hidebar button { font: inherit; font-weight: 600; font-size: 12.5px; color: var(--brand); background: none; border: 0; padding: 0; cursor: pointer; }
        .hidebar button:hover { text-decoration: underline; }
        @media (hover: none) { .hide-btn { opacity: .55; } }

        @media (max-width: 760px) {
            body { padding: 18px 12px 48px; }
            .topbar h1 { font-size: 22px; } .search { width: 100%; } .searchbox { flex: 1 1 100%; }
            .tab { padding: 12px 14px 13px; }
        }
    </style>
</head>
<body>
<div class="container">

    <div class="topbar">
        <div>
            <h1>Emulsion Tracking Dashboard</h1>
            <p>NBT Emulsions · 数据来自 Jira（只读）</p>
        </div>
        <div class="actions">
            <span class="updated"><i class="live" id="live"></i><span id="updated">Loading…</span></span>
            <button class="btn" id="refresh-btn" onclick="handleRefresh()">
                <svg id="refresh-ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
                <span id="refresh-txt">Refresh</span>
            </button>
            <button class="btn hidden-toggle" id="hidden-toggle" type="button" title="Tickets hidden on this computer only">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="m1 1 22 22"/></svg>
                <span id="hidden-toggle-txt">Hidden</span>
            </button>
            <label class="searchbox">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input class="search" id="search" type="text" placeholder="搜编号（如 NE-310）/ 客户 / PO" oninput="render()">
            </label>
        </div>
    </div>

    <div class="loaderr" id="loaderr"></div>

    <div class="hidebar" id="hidebar">
        <span>👁 Showing hidden tickets (dimmed). They are hidden on this computer only.</span>
        <button type="button" id="unhide-all">Unhide all</button>
        <button type="button" id="hidebar-close">Back to normal view</button>
    </div>

    <div class="tabs" id="pipeline"></div>

    <div id="urgent-wrap"></div>
    <div id="normal-wrap"></div>
    <div id="archive-wrap"></div>
</div>

<script>
    const supabaseUrl = 'https://yvtujoueyotncbvdlgyf.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl2dHVqb3VleW90bmNidmRsZ3lmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNDAxOTQsImV4cCI6MjEwMzgxNjE5NH0.mmo23blJAMclVJ2MgMoGDNQiDuKw1_O3bWC3Mp2hdVU';
    const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

    /* ===== 规则（想调整只改这里）===== */

    // 每个状态“超过几天没更新就该跟进”（没列出的状态用默认值）
    const STALE_DAYS = { Checking: 2, Producing: 5, Produced: 2, Delivering: 3, Booking: 3, Booked: 3 };
    const DEFAULT_STALE_DAYS = 5;

    // 处于这些状态却没有对应单据 → 该单据标红“缺”
    const REQUIRED_DOCS = { Produced: [['do_link', 'DO']], Delivering: [['do_link', 'DO']] };

    // 只有这两个才是“最终”状态，沉到最下面折叠
    const DONE_STATUSES = ['Done', 'Cancelled'];

    // 进行中的状态顺序（数据里出现的其他状态会自动追加在后面）
    const FLOW = ['Checking', 'Producing', 'Produced', 'Delivering', 'Booking', 'Booked', 'Delivered', 'Collected'];

    // 各状态的颜色
    const STATUS_COLOR = { Checking: '#3b82f6', Producing: '#f59e0b', Produced: '#7c5cf0', Delivering: '#06b6d4', Booking: '#8b95a8', Booked: '#5b6b86',
                           Delivered: '#10b981', Collected: '#65a30d', Done: '#12a06b', Cancelled: '#8b95a8' };
    const colorOf = s => STATUS_COLOR[s] || '#97a0af';

    /* ================================= */

    /* ===== 本机隐藏：只存在这台电脑的浏览器 localStorage，不改 Supabase / Jira ===== */
    const HIDE_STORE = 'nbt_emulsion_hidden_v1';
    const hiddenKeys = (() => {
        try { return new Set(JSON.parse(localStorage.getItem(HIDE_STORE) || '[]')); } catch (e) { return new Set(); }
    })();
    function saveHidden() { try { localStorage.setItem(HIDE_STORE, JSON.stringify([...hiddenKeys])); } catch (e) { console.warn('localStorage unavailable', e); } }
    let showHidden = false;

    let allTickets = [];
    let currentFilter = 'All Active';
    let loaded = false, loadError = '';
    let prevEndMode = false;

    const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    const safeUrl = u => /^https?:\/\//i.test(String(u || '').trim()) ? esc(String(u).trim()) : '';
    const keyOf = t => t.ticket_key || t.issue_key || '';
    const isDone = t => DONE_STATUSES.includes(t.status);
    const isHidden = t => hiddenKeys.has(keyOf(t));
    const tickets = () => showHidden ? allTickets : allTickets.filter(t => !isHidden(t));   // 隐藏的默认不参与任何统计 / 列表
    const activeList = () => tickets().filter(t => !isDone(t));
    const hideBtn = t => {
        const k = esc(keyOf(t));
        return isHidden(t)
            ? `<button class="hide-btn unhide" data-unhide="${k}" title="Unhide ${k}" aria-label="Unhide ${k}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>`
            : `<button class="hide-btn" data-hide="${k}" title="Hide ${k} (this computer only)" aria-label="Hide ${k}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="m1 1 22 22"/></svg></button>`;
    };
    function updateHideUi() {
        const n = allTickets.filter(isHidden).length;          // 只算数据里还存在的
        const b = document.getElementById('hidden-toggle');
        b.classList.toggle('show', n > 0 || showHidden);
        b.classList.toggle('on', showHidden);
        document.getElementById('hidden-toggle-txt').textContent = showHidden ? 'Hiding off' : `Hidden (${n})`;
        document.getElementById('hidebar').classList.toggle('show', showHidden);
    }

    function jsonVal(raw) {
        if (!raw) return '-';
        try { return String(raw).trim().startsWith('{') ? (JSON.parse(raw).value || '-') : raw; } catch (e) { return raw; }
    }
    function cleanComment(c) {
        if (!c) return '';
        const s = String(c).replace(/\[~accountid:[^\]]+\]\s*/g, '').replace(/<\/?i>/g, '').trim();
        if (!s || /^no comments yet\.?$/i.test(s)) return '';
        return esc(s).replace(/&lt;br\s*\/?&gt;/gi, ' ');
    }
    const stHtml = s => `<span class="st ${String(s).toLowerCase() === 'cancelled' ? 'cancelled' : ''}" style="--c:${colorOf(s)}">${esc(s || 'Pending')}</span>`;

    const AV = ['#5b7cff', '#7c5cf0', '#06b6d4', '#12a06b', '#f59e0b', '#ec4899', '#ef6a4c', '#4f46e5'];
    function avatar(name) {
        const n = String(name || 'Unassigned').trim();
        if (n === 'Unassigned') return `<div class="who"><div class="avatar" style="background:#b4bacb">?</div><span class="dim">Unassigned</span></div>`;
        const parts = n.split(/\s+/);
        const ini = (parts.length > 1 ? parts[0][0] + parts[1][0] : n.slice(0, 2)).toUpperCase();
        let h = 0; for (const ch of n) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
        return `<div class="who" title="${esc(n)}"><div class="avatar" style="background:${AV[h % AV.length]}">${esc(ini)}</div><span>${esc(n)}</span></div>`;
    }

    /* ----- 判断 ----- */
    const daysSince = (t, now) => Math.max(0, Math.floor((now - new Date(t.updated_at || now)) / 86400000));
    const limitOf = t => STALE_DAYS[t.status] ?? DEFAULT_STALE_DAYS;
    function staleLevel(t, now) {
        const lim = limitOf(t), d = daysSince(t, now);
        return d >= lim * 2 ? 3 : d >= Math.ceil(lim * 1.5) ? 2 : d >= lim ? 1 : 0;
    }
    const missingDocs = t => (REQUIRED_DOCS[t.status] || []).filter(([f]) => !t[f]).map(([, l]) => l);
    const needsFollowUp = (t, now) => staleLevel(t, now) > 0 || missingDocs(t).length > 0;
    const score = (t, now) => staleLevel(t, now) * 10 + missingDocs(t).length * 4 + Math.min(daysSince(t, now), 30) * 0.1;

    function poOf(t) {
        const m = String(t.summary || '').match(/PO\s*[:：]?\s*([A-Z0-9][A-Z0-9-]*)/i);
        return m ? m[1].toUpperCase() : '';
    }
    function siblingsOf(t) {
        const po = poOf(t);
        return po ? tickets().filter(o => keyOf(o) !== keyOf(t) && poOf(o) === po) : [];
    }
    function itemsOf(t) {
        const out = [];
        [[t.item_1, t.qty_1], [t.item_2, t.qty_2], [t.item_3, t.qty_3]].forEach(([i, q]) => { if (i && q) out.push([i, Number(q)]); });
        return out;
    }
    function shortDate(v) {
        if (!v) return '-';
        const d = new Date(v);
        return `${d.getMonth() + 1}/${d.getDate()}/${d.getFullYear()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    /* ----- 渲染 ----- */
    function statusOrder() {
        const extra = [...new Set(activeList().map(t => t.status).filter(s => s && !FLOW.includes(s)))];
        return [...FLOW, ...extra];
    }

    function renderTabs(now) {
        const active = activeList(), order = statusOrder();
        if (currentFilter !== 'All Active' && !order.includes(currentFilter) && !DONE_STATUSES.includes(currentFilter)) currentFilter = 'All Active';

        const tab = (label, value, rows, cls) => {
            const n = rows.length, bad = cls === 'end' ? 0 : rows.filter(t => needsFollowUp(t, now)).length;
            return `<button class="tab ${cls} ${loaded && n === 0 ? 'zero' : ''} ${currentFilter === value ? 'active' : ''}" style="--c:${cls === 'all' ? 'var(--brand)' : colorOf(value)}" data-filter="${esc(value)}">
                        <span class="t-name">${esc(label)}</span><span class="t-num">${loaded ? n : '…'}</span>${loaded && bad > 0 ? `<span class="t-bad" title="${bad} 张要跟进">${bad}</span>` : ''}</button>`;
        };
        document.getElementById('pipeline').innerHTML =
            tab('All Active', 'All Active', active, 'all') +
            order.map(s => tab(s, s, active.filter(t => t.status === s), '')).join('') +
            '<span class="t-sep"></span>' +
            DONE_STATUSES.map(s => tab(s, s, tickets().filter(t => t.status === s), 'end')).join('');
    }

    function docsHtml(t, flagMissing) {
        const miss = flagMissing ? missingDocs(t) : [];
        const one = (url, label) => {
            const s = safeUrl(url);
            if (s) return `<a class="doc" href="${s}" target="_blank" rel="noopener">${label}</a>`;
            if (miss.includes(label)) return `<span class="doc missing" title="当前状态应该已有 ${label}">${label} 缺</span>`;
            return `<span class="doc off">${label}</span>`;
        };
        const bl = safeUrl(t.bc_bl_link) ? `<a class="doc" href="${safeUrl(t.bc_bl_link)}" target="_blank" rel="noopener">BL</a>` : '';
        return `<div class="docs">${one(t.po_link, 'PO')}${one(t.do_link, 'DO')}${one(t.invoice_link, 'INV')}${bl}</div>`;
    }

    function rowHtml(t, now) {
        const key = keyOf(t), lv = staleLevel(t, now), d = daysSince(t, now);
        const items = itemsOf(t).map(([i, q]) => `<div class="item">${esc(i)}<b>${q}</b></div>`).join('') || '<span class="dim">-</span>';
        const sibs = siblingsOf(t);
        const sib = sibs.length ? `<div><span class="po-sib" data-jump="${esc(keyOf(sibs[0]))}" title="同一个 PO 的其他单">↳ 同 PO · ${sibs.map(s => esc(keyOf(s)) + ' ' + esc(s.status)).join('、')}</span></div>` : '';
        const cm = cleanComment(t.latest_comment);

        const age = lv > 0
            ? `<span class="age lv${lv}">${d} 天没更新</span><div class="age-sub">时限 ${limitOf(t)} 天 · ${shortDate(t.updated_at)}</div>`
            : `<div class="fresh ${d > 1 ? 'old' : ''}">${d === 0 ? '今天刚更新' : d + ' 天前'}</div><div class="age-sub">${shortDate(t.updated_at)}</div>`;

        return `<tr id="row-${esc(key)}" class="${lv ? 'lv' + lv : ''} ${isHidden(t) ? 'is-hidden' : ''}">
            <td class="k">${hideBtn(t)}<div class="key">${esc(key)}</div><div class="sum">${esc(t.summary || '')}</div>${sib}</td>
            <td>${stHtml(t.status)}</td>
            <td>${avatar(t.assignee)}</td>
            <td class="cust">${esc(jsonVal(t.customer))}</td>
            <td>${esc(jsonVal(t.destination))}</td>
            <td>${items}</td>
            <td>${docsHtml(t, true)}</td>
            <td><div class="comment ${cm ? '' : 'none'}" title="${cm ? cm.replace(/<[^>]*>/g, '') : ''}">${cm || 'No comments yet.'}</div></td>
            <td>${age}</td>
        </tr>`;
    }

    const HEAD = `<colgroup><col style="width:19%"><col style="width:9%"><col style="width:11%"><col style="width:7%"><col style="width:9%"><col style="width:13%"><col style="width:9%"><col style="width:12%"><col style="width:11%"></colgroup>
        <thead><tr><th>Key & Summary</th><th>Status</th><th>Assignee</th><th>Customer</th><th>Destination</th><th>Items & Quantities</th><th>Documents / Links</th><th>Latest Comment</th><th>Last Updated / Delay</th></tr></thead>`;

    function totalsHtml(rows) {
        const sum = {};
        rows.forEach(t => itemsOf(t).forEach(([i, q]) => { sum[i] = (sum[i] || 0) + q; }));
        const e = Object.entries(sum).sort((a, b) => b[1] - a[1]);
        return e.length ? `<div class="totals">合计　${e.map(([i, q]) => `${esc(i)}<b>${q}</b>`).join('')}</div>` : '';
    }

    function section(title, hint, rows, now, urgent) {
        return `<div class="group-head ${urgent ? 'urgent' : ''}"><h2>${title}<span class="cnt">${rows.length}</span></h2><span class="hint">${hint}</span>${totalsHtml(rows)}</div>
                <div class="card"><table class="main">${HEAD}<tbody>${rows.map(t => rowHtml(t, now)).join('')}</tbody></table></div>`;
    }

    function render() {
        const now = new Date();
        updateHideUi();
        renderTabs(now);

        if (DONE_STATUSES.includes(currentFilter)) {       // 点了 Done / Cancelled：只看那一类
            document.getElementById('urgent-wrap').innerHTML = '';
            document.getElementById('normal-wrap').innerHTML = '';
            renderArchive();
            return;
        }

        let rows = activeList();
        if (currentFilter !== 'All Active') rows = rows.filter(t => t.status === currentFilter);
        const q = document.getElementById('search').value.toLowerCase().trim();
        if (q) rows = rows.filter(t => [keyOf(t), t.summary, jsonVal(t.customer), poOf(t)].join(' ').toLowerCase().includes(q));

        const byRecent = (a, b) => new Date(b.updated_at || 0) - new Date(a.updated_at || 0);
        const order = statusOrder();
        const urgent = rows.filter(t => needsFollowUp(t, now)).sort((a, b) => (score(b, now) - score(a, now)) || byRecent(a, b));
        const normal = rows.filter(t => !needsFollowUp(t, now)).sort((a, b) => (order.indexOf(a.status) - order.indexOf(b.status)) || byRecent(a, b));
        const limits = Object.entries(STALE_DAYS).map(([s, d]) => `${s} ${d}天`).join(' · ');

        document.getElementById('urgent-wrap').innerHTML = urgent.length
            ? section('要先跟进', `<span title="${esc(limits)}" style="cursor:help;border-bottom:1px dotted">超过各状态的跟进时限，或缺单据 ⓘ</span>`, urgent, now, true)
            : (loaded && rows.length ? `<div class="allclear">✅ 目前没有需要跟进的单子</div>` : '');

        document.getElementById('normal-wrap').innerHTML = normal.length
            ? section('进行中，正常', '', normal, now, false)
            : (loaded && rows.length === 0 ? `<div class="card" style="margin-top:28px"><div class="empty">No matching active records found.</div></div>` : '');

        renderArchive();
    }

    function renderArchive() {
        const wrap = document.getElementById('archive-wrap');
        const old = wrap.querySelector('details.archive');
        const endMode = DONE_STATUSES.includes(currentFilter);
        const wasOpen = !!(old && old.open) && !prevEndMode;   // 从“只看已结束”切回来时折叠回去
        prevEndMode = endMode;

        let done = tickets().filter(isDone);
        if (!done.length) { wrap.innerHTML = ''; return; }
        const counts = {};
        done.forEach(t => { counts[t.status] = (counts[t.status] || 0) + 1; });
        const total = done.length;

        if (endMode) {
            done = done.filter(t => t.status === currentFilter);
            const q = document.getElementById('search').value.toLowerCase().trim();
            if (q) done = done.filter(t => [keyOf(t), t.summary, jsonVal(t.customer), poOf(t)].join(' ').toLowerCase().includes(q));
        }
        done.sort((a, b) => new Date(b.updated_at || 0) - new Date(a.updated_at || 0));

        const chips = DONE_STATUSES.filter(s => counts[s]).map(s => `<span>${esc(s)}<b>${counts[s]}</b></span>`).join('');
        const rows = done.map(t => `<tr class="${isHidden(t) ? 'is-hidden' : ''}">
            <td class="key">${esc(keyOf(t))}${hideBtn(t)}</td><td class="s">${esc(t.summary || '')}</td><td>${stHtml(t.status)}</td>
            <td>${esc(jsonVal(t.customer))}</td><td>${esc(jsonVal(t.destination))}</td><td>${shortDate(t.updated_at)}</td><td>${docsHtml(t, false)}</td></tr>`).join('')
            || `<tr><td class="empty" colspan="7">No matching records found.</td></tr>`;
        wrap.innerHTML = `<details class="archive" ${endMode || wasOpen ? 'open' : ''} style="${endMode ? 'margin-top:28px' : ''}"><summary>
                <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
                <span>Done / Cancelled Archive<b>${total}</b></span>${chips}${endMode ? `<span>当前只看：<b>${esc(currentFilter)}</b></span>` : ''}</summary>
            <div class="card"><table><tbody>${rows}</tbody></table></div></details>`;
    }

    /* ----- 数据 ----- */
    let lastFetchAt = Date.now();

    async function fetchTickets() {
        let data = null, error = null;
        try { ({ data, error } = await sb.from('emulsion_tickets').select('*')); } catch (e) { error = e; }
        if (error) {
            console.error('获取数据报错:', error);
            loadError = error.message || String(error);
            if (/fetch|network|load failed|abort/i.test(loadError)) loadError += '（连不上 Supabase：请用浏览器直接打开这个页面，不要在预览窗口里看，并检查网络）';
        } else { allTickets = data || []; loadError = ''; loaded = true; }
        lastFetchAt = Date.now();

        const eb = document.getElementById('loaderr');
        eb.style.display = loadError ? 'block' : 'none';
        eb.textContent = loadError ? '⚠️ 数据没有拉取成功：' + loadError + (loaded ? '（下面显示的是上一次的数据）' : '') : '';
        document.getElementById('live').className = 'live' + (loadError ? ' bad' : '');
        document.getElementById('updated').textContent = (loadError ? '刷新失败 · ' : '') + 'Last updated: ' + new Date().toLocaleTimeString();
        render();
    }

    async function handleRefresh() {
        const b = document.getElementById('refresh-btn'), ic = document.getElementById('refresh-ic'), tx = document.getElementById('refresh-txt');
        tx.textContent = 'Loading...'; b.disabled = true; ic.classList.add('spin');
        await fetchTickets();
        tx.textContent = 'Refresh'; b.disabled = false; ic.classList.remove('spin');
    }

    function jumpTo(key) {
        document.getElementById('search').value = '';
        currentFilter = 'All Active';
        render();
        const row = document.getElementById('row-' + key);
        if (!row) return;
        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
        row.querySelectorAll('td').forEach(td => td.style.background = 'color-mix(in srgb, var(--warn) 16%, transparent)');
        setTimeout(() => row.querySelectorAll('td').forEach(td => td.style.background = ''), 1800);
    }

    document.addEventListener('click', e => {
        const h = e.target.closest('[data-hide]');
        if (h) { hiddenKeys.add(h.dataset.hide); saveHidden(); render(); return; }
        const u = e.target.closest('[data-unhide]');
        if (u) {
            hiddenKeys.delete(u.dataset.unhide); saveHidden();
            if (!allTickets.some(isHidden)) showHidden = false;
            render(); return;
        }
        const j = e.target.closest('[data-jump]'); if (j) { jumpTo(j.dataset.jump); return; }
        const f = e.target.closest('[data-filter]'); if (f) { currentFilter = f.dataset.filter; render(); }
    });

    document.getElementById('hidden-toggle').addEventListener('click', () => { showHidden = !showHidden; render(); });
    document.getElementById('hidebar-close').addEventListener('click', () => { showHidden = false; render(); });
    document.getElementById('unhide-all').addEventListener('click', () => {
        if (!confirm('Unhide all tickets on this computer?')) return;
        hiddenKeys.clear(); saveHidden(); showHidden = false; render();
    });

    render();        // 先画出“加载中”的样子
    fetchTickets();

    // 每小时 :05 自动刷新（与后台同步错开）；切回标签页且超过 10 分钟没刷新时补刷
    (function schedule() {
        const n = new Date(), t = new Date(n.getFullYear(), n.getMonth(), n.getDate(), n.getHours(), 5, 0, 0);
        if (n >= t) t.setHours(t.getHours() + 1);
        setTimeout(() => { handleRefresh(); schedule(); }, t - n);
    })();
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && Date.now() - lastFetchAt > 10 * 60 * 1000) handleRefresh();
    });
</script>
</body>
</html>
